# Construction de l'APK Android de test, sur GitHub Actions.
# Ce flux tourne sur GitHub, pas sur la machine de développement.
# Il analyse le code, construit l'APK de test en débogage, et le dépose
# en pièce jointe du flux. Aucun secret n'y est écrit.
name: Flutter APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.27.x"
          channel: stable
      # Le logo officiel est dans le dépôt en texte (deux parties base64),
      # car les fichiers binaires ne passent pas par l'outil Muse.
      # On le restaure ici en PNG avant la construction, puis on ne génère
      # un espace réservé que si aucun logo n'est disponible.
      - name: Restaurer le logo et les binaires manquants
        run: |
          if [ -f assets/logo.png.b64.partaa ] && [ -f assets/logo.png.b64.partab ]; then
            cat assets/logo.png.b64.partaa assets/logo.png.b64.partab | base64 -d > assets/logo.png
          fi
          python3 - << 'PY'
          import os, struct, zlib
          def png(path, w, h, rgba):
              def chunk(t, data):
                  c = struct.pack('>I', len(data)) + t + data
                  return c + struct.pack('>I', zlib.crc32(t + data) & 0xffffffff)
              ihdr = struct.pack('>IIBBBBB', w, h, 8, 6, 0, 0, 0)
              raw = b''.join(b'\x00' + bytes(rgba) * w for _ in range(h))
              data = b'\x89PNG\r\n\x1a\n'
              data += chunk(b'IHDR', ihdr)
              data += chunk(b'IDAT', zlib.compress(raw))
              data += chunk(b'IEND', b'')
              os.makedirs(os.path.dirname(path), exist_ok=True)
              open(path, 'wb').write(data)
          def missing(path):
              return (not os.path.exists(path)) or os.path.getsize(path) < 1000
          navy = (11, 31, 58, 255)
          if missing('assets/logo.png'):
              png('assets/logo.png', 512, 160, navy)
          for size, dpi in [(48, 'mdpi'), (72, 'hdpi'), (96, 'xhdpi'), (144, 'xxhdpi'), (192, 'xxxhdpi')]:
              p = f'android/app/src/main/res/mipmap-{dpi}/ic_launcher.png'
              if missing(p):
                  png(p, size, size, navy)
          PY
          mkdir -p android/gradle/wrapper
          curl -fL -o android/gradle/wrapper/gradle-wrapper.jar https://raw.githubusercontent.com/gradle/gradle/v8.3.0/gradle/wrapper/gradle-wrapper.jar
          chmod +x android/gradlew
          ls -lh assets/logo.png android/gradle/wrapper/gradle-wrapper.jar
      - name: Générer la Bible complète
        run: python3 tools/build_bible.py
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.27.x"
          channel: stable
      - run: flutter config --enable-windows-desktop
      # Le logo officiel est dans le depot en texte (deux parties base64),
      # car les fichiers binaires ne passent pas par l'outil Muse.
      # On le restaure ici en PNG avant la construction.
      - name: Restaurer le logo
        run: |
          if ((Test-Path assets/logo.png.b64.partaa) -and (Test-Path assets/logo.png.b64.partab)) {
            $b64 = (Get-Content assets/logo.png.b64.partaa -Raw) + (Get-Content assets/logo.png.b64.partab -Raw)
            [IO.File]::WriteAllBytes('assets/logo.png', [Convert]::FromBase64String($b64))
          }
          if (Test-Path assets/logo.png) { Get-Item assets/logo.png | Select-Object Length }
      - name: Générer la Bible complète
        run: python tools/build_bible.py
      # L'icone Windows est generee depuis le monogramme CP, deja restaure
      # par l'etape precedente, pour eviter de pousser un binaire.
      - name: Générer l'icône Windows
        run: python tools/make_windows_icon.py
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - run: flutter build windows --release
      - uses: actions/upload-artifact@v4
        with:
          name: app-windows
          path: build/windows/x64/runner/Release
          if-no-files-found: error
