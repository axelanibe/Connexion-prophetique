# Construction de l'APK Android de test, sur GitHub Actions.
# Ce flux tourne sur GitHub, pas sur la machine de développement.
# Il analyse le code, construit l'APK de test en débogage, et le dépose
# en pièce jointe du flux. Aucun secret n'y est écrit.
name: Flutter APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.27.x"
          channel: stable
      # Fichiers binaires non poussés par l'outil Muse (texte seulement) :
      # on régénère ici des espaces réservés, pour que la construction aboutisse.
      # Le logo officiel doit être remis dans assets/logo.png avant diffusion.
      - name: Régénérer les binaires manquants
        run: |
          python3 - << 'PY'
          import os, struct, zlib
          def png(path, w, h, rgba):
              def chunk(t, data):
                  c = struct.pack('>I', len(data)) + t + data
                  return c + struct.pack('>I', zlib.crc32(t + data) & 0xffffffff)
              ihdr = struct.pack('>IIBBBBB', w, h, 8, 6, 0, 0, 0)
              raw = b''.join(b'\x00' + bytes(rgba) * w for _ in range(h))
              data = b'\x89PNG\r\n\x1a\n'
              data += chunk(b'IHDR', ihdr)
              data += chunk(b'IDAT', zlib.compress(raw))
              data += chunk(b'IEND', b'')
              os.makedirs(os.path.dirname(path), exist_ok=True)
              open(path, 'wb').write(data)
          navy = (11, 31, 58, 255)
          png('assets/logo.png', 512, 160, navy)
          for size, dpi in [(48, 'mdpi'), (72, 'hdpi'), (96, 'xhdpi'), (144, 'xxhdpi'), (192, 'xxxhdpi')]:
              png(f'android/app/src/main/res/mipmap-{dpi}/ic_launcher.png', size, size, navy)
          PY
          curl -L -o android/gradle/wrapper/gradle-wrapper.jar https://raw.githubusercontent.com/gradle/gradle/v8.3.0/gradle/wrapper/gradle-wrapper.jar
          ls -lh assets/logo.png android/gradle/wrapper/gradle-wrapper.jar
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
