name: connexion_prophetique
description: "CONNEXION PROPHÉTIQUE — carte de membre, Bible, camps, dons, établissements, Bureau."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  http: ^1.2.0
  shared_preferences: ^2.2.0
  qr_flutter: ^4.1.0
  mobile_scanner: ^5.2.0
  share_plus: ^9.0.0
  url_launcher: ^6.3.0
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    # Logo officiel détouré de la structure, copié depuis les actifs
    # du prototype le 26 octobre 2026.
    - assets/logo.png
    # Texte biblique fourni par la structure, voir lib/bible.dart.
    # Pour l'instant, seul le Psaume 23:1, déjà utilisé dans l'application.
    - assets/bible.json
