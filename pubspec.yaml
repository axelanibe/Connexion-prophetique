name: connexion_prophetique
description: "CONNEXION PROPHÉTIQUE — carte de membre, Bible, camps, dons, établissements, Bureau."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  http: ^1.2.0
  shared_preferences: ^2.2.0
  qr_flutter: ^4.1.0
  mobile_scanner: ^5.2.0
  share_plus: ^9.0.0
  url_launcher: ^6.3.0
  webview_flutter: ^4.10.0
  intl: ^0.19.0
  image_picker: ^1.1.2
  file_picker: ^8.0.0
  just_audio: ^0.9.44
  flutter_tts: ^4.2.5
  path_provider: ^2.1.5
  image: ^4.12.0
  flutter_local_notifications: ^19.5.0
  gal: ^2.3.0
  timezone: ^0.10.1
  device_info_plus: ^10.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    # Logo officiel détouré de la structure, copié depuis les actifs
    # du prototype le 26 octobre 2026.
    - assets/logo.png
    # Logo CP d'en-tête de la version web, recadré depuis la
    # capture web, restauré à la construction depuis ses parties
    # base64, voir tools/build_bible.py.
    - assets/cp_monogram.png
    # Texte biblique complet, voir lib/bible.dart : Louis Segond 1910
    # en français et King James en anglais, tous deux domaine public.
    - assets/bible.json
