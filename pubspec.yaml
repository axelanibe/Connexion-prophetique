name: connexion_prophetique
description: "CONNEXION PROPHÉTIQUE — carte de membre, Bible, camps, dons, établissements, Bureau."
publish_to: "none"
version: 1.0.1+2

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  http: ^1.2.0
  shared_preferences: ^2.2.0
  qr_flutter: ^4.1.0
  flutter_svg: ^2.0.0
  # MO-23, 22 nov. 2026 : Jakarta Sans, Lora et Outfit sont
  # embarquées en assets comme Cinzel, plus aucun téléchargement
  # de police à l'exécution. google_fonts est retiré.
  flutter_animate: ^4.5.0
  lottie: ^3.1.0
  cached_network_image: ^3.4.0
  shimmer: ^3.0.0
  fl_chart: ^0.69.0
  flutter_screenutil: ^5.9.0
  mobile_scanner: ^6.0.0
  flutter_secure_storage: ^9.2.4
  share_plus: ^11.1.0
  url_launcher: ^6.3.0
  webview_flutter: ^4.10.0
  intl: ^0.19.0
  image_picker: ^1.1.2
  file_picker: ^8.0.0
  just_audio: ^0.9.44
  flutter_tts: ^4.2.5
  path_provider: ^2.1.5
  image: ^4.12.0
  flutter_local_notifications: ^19.5.0
  # Carte 94, 8 nov. 2026 : nom IANA du fuseau de l'appareil, pour
  # régler tz.local avant de programmer le verset de 7 h. Dart ne
  # donne que l'abréviation (EST, EDT), sans règles de changement
  # d'heure, donc sans ce paquet tz.local resterait UTC et le
  # verset partirait à la mauvaise heure. Version 4.1.1, la 5.x
  # exige meta 1.16, incompatible avec flutter_test du SDK, qui
  # épingle meta 1.15.0.
  flutter_timezone: ^4.1.1
  gal: ^2.3.0
  timezone: ^0.10.1
  device_info_plus: ^10.1.2
  # Notifications poussées Android, 2 nov. 2026 : versions épinglées
  # exactement, pas de caret, pour ne pas dériver vers une version
  # exigeant Flutter 3.38 ou plus. Résolution vérifiée avec
  # Flutter 3.27.0, Dart 3.6.0, versions vérifiées ensemble :
  # firebase_core 3.4.1, firebase_messaging 15.1.0. iOS différé,
  # Firebase n'est jamais initialisé sur le web dans cette tranche.
  # firebase_core 3.4.1 (et non 3.4.0) depuis les appels, 16 nov.
  # 2026 : firebase_messaging_web exige ^3.4.1 dès que web ^1.0.0
  # entre en jeu, par share_plus 11 et flutter_webrtc 1.6.3.
  firebase_core: 3.4.1
  firebase_messaging: 15.1.0
  # Demandes système de l'écran de bienvenue du premier lancement,
  # 29 oct. 2026 : notifications, appareil photo, photos et médias.
  permission_handler: ^12.0.0
  flutter_pdfview: 1.3.3
  # Appels audio et vidéo dans la messagerie, 16 nov. 2026 :
  # WebRTC pair à pair (STUN Google, TURN OpenRelay en repli).
  # Version épinglée exactement, comme firebase_core et
  # firebase_messaging : la 0.11.6+hotfix.1, compatible avec
  # share_plus 9.0.0, ne compile pas pour le web sous Flutter
  # 3.27.0 (Dart 3.6 refuse les .toJS sur dynamic de son
  # dart_webrtc 1.4.8). La 1.6.3 exige web ^1.0.0, donc share_plus
  # monte en 11.1.0 (son API Share.shareXFiles est inchangée).
  # Correctif run APK 34, 17 nov. 2026 : la 1.6.3 ne compile pas
  # sur Android avec Flutter 3.27, son SurfaceTextureRenderer
  # implémente onSurfaceCleanup (inexistant dans le moteur 3.27)
  # au lieu de onSurfaceDestroyed (abstrait dans le moteur 3.27).
  # La 0.13.0, dernière avant ce changement amont, implémente
  # onSurfaceDestroyed et compile sur le web avec dart_webrtc
  # ^1.5.3 (résolu 1.8.2, webrtc_interface 1.5.1).
  flutter_webrtc: 0.13.0
  # Écran d'appel natif comme WhatsApp, 20 nov. 2026 : un appel
  # entrant affiche l'écran système (plein écran, sonnerie du
  # téléphone) même application fermée ou téléphone verrouillé,
  # Android seulement, iOS différé. Version 3.1.6 épinglée
  # exactement, comme firebase_core et flutter_webrtc : SDK
  # Dart >=3.0.0 <4.0.0 et Flutter >=3.10.0, compatibles avec
  # Flutter 3.27.0 et Dart 3.6.0, vérifiés par résolution.
  # Tous les appels CallKit sont gardés derrière !kIsWeb et
  # Platform.isAndroid dans lib/push_notifications.dart, le web
  # continue à compiler et à fonctionner comme avant.
  flutter_callkit_incoming: 3.1.6
  # Fermeture de la page pendant un appel, carte 4, 21 nov. 2026 :
  # fetch avec keepalive pour envoyer 'termine' à la fermeture,
  # avec l'en-tête Authorization que sendBeacon ne peut pas porter.
  # Version 1.1.1 déjà résolue en transitif, épinglée ici en direct.
  web: ^1.1.1
  # Signalisation WebSocket, même service Render : client
  # multiplateforme (mobile et web) pour /messagerie/ws.
  web_socket_channel: ^3.0.0
  # Stories de 24 heures, 17 nov. 2026 : lecture des courtes
  # vidéos dans le lecteur de story, web et mobile.
  video_player: ^2.9.0
  photo_manager: ^3.12.0
  # Magnétophone, 18 nov. 2026 : record 6.2.1 ; google_sign_in 6.2.2
  # et googleapis 14.0.0 pour la sauvegarde Drive, résolus sans
  # conflit avec flutter_webrtc 0.13.0, web 1.1.1 gardé. record 6.2.1
  # (et non 5.2.1) : record_linux 0.7.2 ne compile pas contre
  # record_platform_interface 1.6.0, il lui manque startStream et
  # l'argument nommé request de hasPermission, ce qui a fait échouer
  # le run APK 40. record_linux 1.3.1, tiré par record 6.2.1,
  # implémente les deux. API utilisée inchangée.
  record: 6.2.1
  google_sign_in: 6.2.2
  googleapis: 14.0.0
  lucide_icons_flutter: ^4.0.3
  encrypt: ^5.0.3
  crypto: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  fonts:
    # Cinzel, 20 nov. 2026, décision d'Axel : titre de l'en-tête
    # en majuscules, hors ligne, servie par le service worker.
    # TTF statiques latin, google-webfonts-helper, licence OFL,
    # poids 500, 600, 700 et 800. Le titre utilise le 700.
    # Playfair et google_fonts restent pour le reste de l'app.
    - family: Cinzel
      fonts:
        - asset: assets/fonts/Cinzel-500.ttf
          weight: 500
        - asset: assets/fonts/Cinzel-600.ttf
          weight: 600
        - asset: assets/fonts/Cinzel-700.ttf
          weight: 700
        - asset: assets/fonts/Cinzel-800.ttf
          weight: 800
    # MO-23, 22 nov. 2026 : Jakarta Sans, Lora et Outfit,
    # TTF statiques latin, google-webfonts-helper, licence OFL,
    # fichiers OFL joints dans assets/fonts. Lora s'arrête à 700,
    # un 800 demandé retombe sur le 700.
    - family: Plus Jakarta Sans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-400.ttf
          weight: 400
        - asset: assets/fonts/PlusJakartaSans-500.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-600.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-700.ttf
          weight: 700
        - asset: assets/fonts/PlusJakartaSans-800.ttf
          weight: 800
    - family: Lora
      fonts:
        - asset: assets/fonts/Lora-400.ttf
          weight: 400
        - asset: assets/fonts/Lora-500.ttf
          weight: 500
        - asset: assets/fonts/Lora-600.ttf
          weight: 600
        - asset: assets/fonts/Lora-700.ttf
          weight: 700
        - asset: assets/fonts/Lora-400-Italic.ttf
          weight: 400
          style: italic
    - family: Outfit
      fonts:
        - asset: assets/fonts/Outfit-400.ttf
          weight: 400
        - asset: assets/fonts/Outfit-500.ttf
          weight: 500
        - asset: assets/fonts/Outfit-600.ttf
          weight: 600
        - asset: assets/fonts/Outfit-700.ttf
          weight: 700
        - asset: assets/fonts/Outfit-800.ttf
          weight: 800
  assets:
    # Logo officiel détouré de la structure, copié depuis les actifs
    # du prototype le 26 octobre 2026.
    - assets/logo.png
    # Logo CP d'en-tête de la version web, recadré depuis la
    # capture web, restauré à la construction depuis ses parties
    # base64, voir tools/build_bible.py.
    - assets/cp_monogram.png
    # Nouveau logo bleu et rouge de l'en-tête, 19 nov. 2026,
    # envoyé par Axel, fond blanc, jamais redessiné ni recoloré.
    # Restauré à la construction depuis ses parties base64,
    # comme le monogramme, voir tools/build_bible.py.
    - assets/logo_entete.jpg
    # Photo d'ouverture APK, recadrée de la maquette d'Axel, 1er nov. 2026.
    - assets/ouverture_priere.jpg
    # Logo bleu pour l'écran d'ouverture seulement, variante du logo
    # officiel pour fond clair, 1er nov. 2026.
    - assets/logo_bleu.png
    # Son de démarrage du minuteur de prière, carte 85, 7 nov. 2026 :
    # cloche de 2 secondes générée localement (fondamentale 587 Hz
    # et partiels de cloche, sans enregistrement externe), jouée par
    # just_audio, déjà utilisé pour les enseignements.
    - assets/audio/cloche-priere.wav
    # Sons d'appel, étape 2, 20 nov. 2026 : sonnerie de l'appelé et
    # tonalité d'attente de l'appelant, générés localement par
    # tools/generer_sons_appel.py, joués en boucle par just_audio.
    - assets/audio/sonnerie-appel.wav
    - assets/audio/tonalite-appel.wav
    # Sons choisis par le membre, 21 nov. 2026 : trois variantes de
    # sonnerie d'appel et deux variantes de son des messages, avec
    # écoute avant de choisir, dans Paramètres. La variante
    # classique est le fichier finalisé sonnerie-appel.wav, ci-dessus
    # en sonnerie de l'appelé. Mêmes fichiers en res/raw pour la
    # sonnerie CallKit et le son de notification.
    - assets/audio/sonnerie-appel-cp-melodie.wav
    - assets/audio/sonnerie-appel-cp-carillon.wav
    - assets/audio/son-message-ding-dong.wav
    - assets/audio/son-message-trois-notes.wav
    # Photos de la vitrine, fournies par Axel le 1er nov. 2026 :
    # 3 affiches de campagne et 3 photos de terrain.
    - assets/vitrine/campagne-jesus-pour-ecole-ivoirienne-drogue-non.jpg
    - assets/vitrine/campagne-jesus-pour-ecole-ivoirienne-drogue-seringues.jpg
    - assets/vitrine/campagne-jesus-pour-ecole-ivoirienne-grossesse.jpg
    - assets/vitrine/distribution-repas-cour.jpg
    - assets/vitrine/distribution-repas-file.jpg
    - assets/vitrine/sensibilisation-animatrice-micro.jpg
    # Vraies photos boostées par IA (1er nov. 2026), préfixe boost-.
    - assets/vitrine/boost-priere.jpg
    - assets/vitrine/boost-foule.jpg
    - assets/vitrine/boost-groupe.jpg
    - assets/vitrine/boost-orateur.jpg
    # Texte biblique complet, voir lib/bible.dart : Louis Segond 1910
    # en français et King James en anglais, tous deux domaine public.
    - assets/bible.json
    # Lexique de Strong en hébreu, carte 54, 6 nov. 2026 : 8 674
    # entrées H1-H8674, James Strong 1894, édition JSON Open
    # Scriptures 2010, CC-BY-SA, texte Strong domaine public.
    # Chargé à la demande seulement, jamais au démarrage.
    - assets/strong_hebrew.json
    # Lexique de Strong en grec, carte 58, 6 nov. 2026 : 5 523
    # entrées, G1-G5624, 101 numéros absents de la source,
    # James Strong 1890, édition JSON Open Scriptures 2009,
    # CC-BY-SA, texte Strong domaine public. Même format
    # raccourci que l'hébreu, sans prononciation, la source
    # grecque n'en donne pas. Chargé à la demande seulement.
    - assets/strong_greek.json
    # Dictionnaire Littré, carte 60, 6 nov. 2026 : 75 866
    # vedettes, Émile Littré 1863-1872, texte domaine public,
    # numérisation XML François Gannaz, CC-BY-SA 3.0,
    # attribution littre.org. Un fichier par lettre, 24,4 Mo
    # au total, jamais plus de 2,7 Mo chargés à la fois, une
    # lettre à la demande seulement, jamais au démarrage.
    - assets/littre/a.json
    - assets/littre/b.json
    - assets/littre/c.json
    - assets/littre/d.json
    - assets/littre/e.json
    - assets/littre/f.json
    - assets/littre/g.json
    - assets/littre/h.json
    - assets/littre/i.json
    - assets/littre/j.json
    - assets/littre/k.json
    - assets/littre/l.json
    - assets/littre/m.json
    - assets/littre/n.json
    - assets/littre/o.json
    - assets/littre/oe.json
    - assets/littre/p.json
    - assets/littre/q.json
    - assets/littre/r.json
    - assets/littre/s.json
    - assets/littre/t.json
    - assets/littre/u.json
    - assets/littre/v.json
    - assets/littre/w.json
    - assets/littre/x.json
    - assets/littre/y.json
    - assets/littre/z.json
