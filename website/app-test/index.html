<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CONNEXION PROPHETIQUE</title>
<meta http-equiv="refresh" content="0; url=/">
<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.getRegistrations().then(function (rs) {
    rs.forEach(function (r) { r.unregister(); });
  }).catch(function () {});
}
window.location.replace('/');
</script>
<style>
body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #0B1F3A; color: #fff; font-family: system-ui, sans-serif; text-align: center; }
main { padding: 24px; }
h1 { font-size: 22px; letter-spacing: 1px; margin: 0 0 12px; }
p { color: rgba(255, 255, 255, 0.75); margin: 0 0 20px; }
a { display: inline-block; background: #D4A72C; color: #0B1F3A; font-weight: 700; text-decoration: none; padding: 14px 28px; border-radius: 14px; }
</style>
</head>
<body>
<main>
<h1>CONNEXION PROPHÉTIQUE</h1>
<p>L'application a déménagé à la racine du domaine…</p>
<p><a href="/">Ouvrir l'application</a></p>
</main>
</body>
</html>
