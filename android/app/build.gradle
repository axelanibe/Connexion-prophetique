plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
    // Notifications poussées Android, 2 nov. 2026 : applique le
    // plugin Google Services déclaré dans settings.gradle. Il lit
    // android/app/google-services.json, à déposer par l'interface
    // web GitHub, comme les autres fichiers binaires, et génère
    // les ressources Firebase au build. Sans ce fichier, le build
    // échoue avec un message clair, il ne produit pas une APK
    // silencieusement sans poussée.
    id "com.google.gms.google-services"
}

android {
    namespace = "ci.connexionprophetique.app"
    // Proposition Gemini, adaptée : cible API 36 exigée par Play Store en 2026,
    // et minSdk 26, exigé par la bibliothèque Jitsi depuis le 1er nov. 2026.
    // L'identifiant reste ci.connexionprophetique.app, et non
    // l'exemple com.example de la proposition, sinon Play Store refuserait l'AAB.
    compileSdk = 36
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId = "ci.connexionprophetique.app"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        minSdk = 26
        targetSdk = 36
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    buildTypes {
        release {
            // TODO: Add your own signing config for the release build.
            // Signing with the debug keys for now, so `flutter run --release` works.
            signingConfig = signingConfigs.debug
        }
    }
}

flutter {
    source = "../.."
}
