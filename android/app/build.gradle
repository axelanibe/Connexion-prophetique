plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
    // Notifications poussées Android, 2 nov. 2026 : applique le
    // plugin Google Services déclaré dans settings.gradle. Il lit
    // android/app/google-services.json, à déposer par l'interface
    // web GitHub, comme les autres fichiers binaires, et génère
    // les ressources Firebase au build. Sans ce fichier, le build
    // échoue avec un message clair, il ne produit pas une APK
    // silencieusement sans poussée.
    id "com.google.gms.google-services"
}

// Signature de publication, cartes 36 à 39, nov. 2026 : lue uniquement
// depuis un fichier key.properties temporaire, jamais commité, jamais
// dans le dépôt. Le workflow signé le crée depuis les secrets Actions
// (KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD) puis
// le supprime en fin de job, même en cas d'échec. Sans ce fichier,
// la release retombe sur la signature de débogage, comme avant, pour
// ne pas casser les builds de test existants. Aucun secret en clair ici.
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("key.properties")
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace = "ci.connexionprophetique.app"
    // Proposition Gemini, adaptée : cible API 36 exigée par Play Store en 2026,
    // et minSdk 26, gardé à 26 après le retrait Jitsi du 2 nov. 2026,
    // pour ne pas créer un risque de construction Android.
    // L'identifiant reste ci.connexionprophetique.app, et non
    // l'exemple com.example de la proposition, sinon Play Store refuserait l'AAB.
    compileSdk = 36
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId = "ci.connexionprophetique.app"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        minSdk = 26
        targetSdk = 36
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    signingConfigs {
        // Définie seulement si key.properties est présent, sinon Gradle
        // ne valide pas un fichier de clé absent.
        if (keystorePropertiesFile.exists()) {
            release {
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
                storeFile keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
                storePassword keystoreProperties['storePassword']
            }
        }
    }

    buildTypes {
        release {
            // Avec key.properties : signature de publication.
            // Sans : signature de débogage, comme avant.
            signingConfig = keystorePropertiesFile.exists() ? signingConfigs.release : signingConfigs.debug
        }
    }
}

flutter {
    source = "../.."
}
